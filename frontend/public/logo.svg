<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="30%" stop-color="#F3C64F" />
      <stop offset="60%" stop-color="#D49E24" />
      <stop offset="90%" stop-color="#AA7107" />
      <stop offset="100%" stop-color="#FFEC9E" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#C68A12" />
      <stop offset="100%" stop-color="#7A4E00" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#DAA520" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="600" fill="#000000" rx="32" />
  <circle cx="300" cy="300" r="280" fill="url(#goldGlow)" />

  <g filter="url(#shadow)">
    <!-- Camera Body Silhouette Outline -->
    <!-- Top camera flash bump -->
    <path d="M220,180 L250,155 L350,155 L380,180 Z" fill="none" stroke="url(#goldLight)" stroke-width="7" stroke-linejoin="round" />
    <!-- Main camera rounded rectangle frame -->
    <rect x="100" y="180" width="400" height="250" rx="40" ry="40" fill="none" stroke="url(#goldLight)" stroke-width="8" />

    <!-- Camera Lens Arc Ring behind Crown -->
    <path d="M210,210 A 110,110 0 0,1 390,210" fill="none" stroke="url(#goldLight)" stroke-width="12" stroke-linecap="round" />
    <path d="M225,210 A 95,95 0 0,1 375,210" fill="none" stroke="url(#goldDark)" stroke-width="6" />

    <!-- CROWN AT TOP -->
    <g transform="translate(300, 150)">
      <!-- Crown Base -->
      <path d="M-80,10 C-40,-5 40,-5 80,10 C70,25 -70,25 -80,10 Z" fill="url(#goldLight)" />
      <!-- Crown Jewels Base Band -->
      <path d="M-75,12 C-40,0 40,0 75,12 L70,20 C35,8 -35,8 -70,20 Z" fill="url(#goldDark)" />
      <!-- Crown Peaks -->
      <path d="M-80,10 L-95,-50 L-45,-15 L0,-70 L45,-15 L95,-50 L80,10 Z" fill="url(#goldLight)" stroke="url(#goldDark)" stroke-width="2" />
      <!-- Crown Spheres on Peak tips -->
      <circle cx="-95" cy="-52" r="7" fill="url(#goldText)" />
      <circle cx="-45" cy="-17" r="6" fill="url(#goldText)" />
      <circle cx="0" cy="-72" r="9" fill="url(#goldText)" />
      <circle cx="45" cy="-17" r="6" fill="url(#goldText)" />
      <circle cx="95" cy="-52" r="7" fill="url(#goldText)" />
    </g>

    <!-- SACHIN TYPOGRAPHY -->
    <text x="280" y="315" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-weight="900" font-size="76" fill="url(#goldText)" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">
      SACHIN
    </text>

    <!-- KING TYPOGRAPHY WITH ACCENT LINES -->
    <g transform="translate(280, 360)">
      <!-- Left Double Lines -->
      <line x1="-190" y1="-12" x2="-80" y2="-12" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round" />
      <line x1="-170" y1="-2" x2="-80" y2="-2" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" />
      
      <!-- KING Text -->
      <text x="0" y="5" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-weight="900" font-size="44" fill="url(#goldLight)" text-anchor="middle" letter-spacing="8">
        KING
      </text>

      <!-- Right Double Lines -->
      <line x1="80" y1="-12" x2="190" y2="-12" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round" />
      <line x1="80" y1="-2" x2="170" y2="-2" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- PHOTO FRAME BADGE RIBBON AT BOTTOM -->
    <g transform="translate(300, 420)">
      <!-- Outer Gold Border Badge -->
      <rect x="-195" y="-22" width="390" height="44" rx="22" fill="#000000" stroke="url(#goldLight)" stroke-width="4" />
      <!-- Inner Thin Gold Line -->
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="none" stroke="url(#goldDark)" stroke-width="1.5" />
      <!-- Text PHOTO FRAME -->
      <text x="0" y="7" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
        PHOTO FRAME
      </text>
    </g>

    <!-- Bottom Diamond Accent -->
    <polygon points="300,455 308,463 300,471 292,463" fill="url(#goldLight)" />
    <line x1="200" y1="463" x2="285" y2="463" stroke="url(#goldLight)" stroke-width="2" />
    <line x1="315" y1="463" x2="400" y2="463" stroke="url(#goldLight)" stroke-width="2" />

    <!-- TILTED PICTURE FRAME ICON ON RIGHT SIDE -->
    <g transform="translate(485, 340) rotate(12)">
      <!-- Outer Frame Shadow & Bevel -->
      <rect x="-42" y="-52" width="84" height="104" rx="6" fill="#1a1205" stroke="url(#goldLight)" stroke-width="7" filter="url(#shadow)" />
      <rect x="-36" y="-46" width="72" height="92" rx="3" fill="#000000" stroke="url(#goldDark)" stroke-width="2" />
      
      <!-- Inner Photo canvas -->
      <rect x="-32" y="-42" width="64" height="84" fill="#EAEAEA" />
      
      <!-- Heart Icon in Photo -->
      <path d="M0,-24 C-3,-30 -10,-30 -12,-25 C-15,-20 -10,-12 0,-5 C10,-12 15,-20 12,-25 C10,-30 3,-30 0,-24 Z" fill="#D32F2F" />

      <!-- Couple Silhouette inside Photo -->
      <!-- Male Silhouette -->
      <path d="M-18,22 C-18,10 -10,0 -4,-2 C-1,-3 0,2 0,10 C0,18 -8,25 -18,25 Z" fill="#212121" />
      <circle cx="-10" cy="-6" r="6" fill="#212121" />

      <!-- Female Silhouette -->
      <path d="M18,22 C18,10 10,0 4,-2 C1,-3 0,2 0,10 C0,18 8,25 18,25 Z" fill="#212121" />
      <circle cx="10" cy="-6" r="5" fill="#212121" />
    </g>
  </g>
</svg>
