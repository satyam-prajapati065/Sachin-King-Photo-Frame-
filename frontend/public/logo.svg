<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"></stop>
      <stop offset="30%" stop-color="#F3C64F"></stop>
      <stop offset="60%" stop-color="#D49E24"></stop>
      <stop offset="90%" stop-color="#AA7107"></stop>
      <stop offset="100%" stop-color="#FFEC9E"></stop>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"></stop>
      <stop offset="50%" stop-color="#C68A12"></stop>
      <stop offset="100%" stop-color="#7A4E00"></stop>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"></stop>
      <stop offset="25%" stop-color="#FFD54F"></stop>
      <stop offset="50%" stop-color="#DAA520"></stop>
      <stop offset="75%" stop-color="#B8860B"></stop>
      <stop offset="100%" stop-color="#FFE082"></stop>
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"></feDropShadow>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
  </defs>

  <!-- Background Layer -->
  
  

  <g filter="url(#shadow)">
    <!-- Camera Body Silhouette Outline -->
    <!-- Top camera flash bump -->
    <path d="M220,180 L250,155 L350,155 L380,180 Z" fill="none" stroke="url(#goldLight)" stroke-width="7" stroke-linejoin="round" data-index="0"></path>
    <!-- Main camera rounded rectangle frame -->
    <rect x="100" y="180" width="400" height="250" rx="40" ry="40" fill="none" stroke="url(#goldLight)" stroke-width="8"></rect>

    <!-- Camera Lens Arc Ring behind Crown -->
    <path d="M210,210 A 110,110 0 0,1 390,210" fill="none" stroke="url(#goldLight)" stroke-width="12" stroke-linecap="round" data-index="1"></path>
    <path d="M225,210 A 95,95 0 0,1 375,210" fill="none" stroke="url(#goldDark)" stroke-width="6" data-index="2"></path>

    <!-- CROWN AT TOP -->
    <g transform="translate(300, 150)">
      <!-- Crown Base -->
      <path d="M-80,10 C-40,-5 40,-5 80,10 C70,25 -70,25 -80,10 Z" fill="url(#goldLight)" data-index="3"></path>
      <!-- Crown Jewels Base Band -->
      <path d="M-75,12 C-40,0 40,0 75,12 L70,20 C35,8 -35,8 -70,20 Z" fill="url(#goldDark)" data-index="4"></path>
      <!-- Crown Peaks -->
      <path d="M-80,10 L-95,-50 L-45,-15 L0,-70 L45,-15 L95,-50 L80,10 Z" fill="url(#goldLight)" stroke="url(#goldDark)" stroke-width="2" data-index="5"></path>
      <!-- Crown Spheres on Peak tips -->
      <circle cx="-95" cy="-52" r="7" fill="url(#goldText)"></circle>
      <circle cx="-45" cy="-17" r="6" fill="url(#goldText)"></circle>
      <circle cx="0" cy="-72" r="9" fill="url(#goldText)"></circle>
      <circle cx="45" cy="-17" r="6" fill="url(#goldText)"></circle>
      <circle cx="95" cy="-52" r="7" fill="url(#goldText)"></circle>
    </g>

    <!-- SACHIN TYPOGRAPHY -->
    <text x="280" y="315" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-weight="900" font-size="76" fill="url(#goldText)" text-anchor="middle" letter-spacing="3" filter="url(#shadow)">
      SACHIN
    </text>

    <!-- KING TYPOGRAPHY WITH ACCENT LINES -->
    <g transform="translate(280, 360)">
      <!-- Left Double Lines -->
      <line x1="-190" y1="-12" x2="-80" y2="-12" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"></line>
      <line x1="-170" y1="-2" x2="-80" y2="-2" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round"></line>
      
      <!-- KING Text -->
      <text x="0" y="5" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-weight="900" font-size="44" fill="url(#goldLight)" text-anchor="middle" letter-spacing="8">
        KING
      </text>

      <!-- Right Double Lines -->
      <line x1="80" y1="-12" x2="190" y2="-12" stroke="url(#goldLight)" stroke-width="4" stroke-linecap="round"></line>
      <line x1="80" y1="-2" x2="170" y2="-2" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round"></line>
    </g>

    <!-- PHOTO FRAME BADGE RIBBON AT BOTTOM -->
    <g transform="translate(300, 420)">
      <!-- Outer Gold Border Badge -->
      <rect x="-195" y="-22" width="390" height="44" rx="22" fill="#000000" stroke="url(#goldLight)" stroke-width="4"></rect>
      <!-- Inner Thin Gold Line -->
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="none" stroke="url(#goldDark)" stroke-width="1.5"></rect>
      <!-- Text PHOTO FRAME -->
      <text x="0" y="7" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
        PHOTO FRAME
      </text>
    </g>

    <!-- Bottom Diamond Accent -->
    <polygon points="300,455 308,463 300,471 292,463" fill="url(#goldLight)"></polygon>
    <line x1="200" y1="463" x2="285" y2="463" stroke="url(#goldLight)" stroke-width="2"></line>
    <line x1="315" y1="463" x2="400" y2="463" stroke="url(#goldLight)" stroke-width="2"></line>

    <!-- TILTED PICTURE FRAME ICON ON RIGHT SIDE -->
    <g transform="translate(485, 340) rotate(12)">
      <!-- Outer Frame Shadow & Bevel -->
      <rect x="-42" y="-52" width="84" height="104" rx="6" fill="#1a1205" stroke="url(#goldLight)" stroke-width="7" filter="url(#shadow)"></rect>
      <rect x="-36" y="-46" width="72" height="92" rx="3" fill="#000000" stroke="url(#goldDark)" stroke-width="2"></rect>
      
      <!-- Inner Photo canvas -->
      <rect x="-32" y="-42" width="64" height="84" fill="#EAEAEA"></rect>
      
      <!-- Heart Icon in Photo -->
      <path d="M0,-24 C-3,-30 -10,-30 -12,-25 C-15,-20 -10,-12 0,-5 C10,-12 15,-20 12,-25 C10,-30 3,-30 0,-24 Z" fill="#D32F2F" data-index="6"></path>

      <!-- Couple Silhouette inside Photo -->
      <!-- Male Silhouette -->
      <path d="M-18,22 C-18,10 -10,0 -4,-2 C-1,-3 0,2 0,10 C0,18 -8,25 -18,25 Z" fill="#212121" data-index="7"></path>
      <circle cx="-10" cy="-6" r="6" fill="#212121"></circle>

      <!-- Female Silhouette -->
      <path d="M18,22 C18,10 10,0 4,-2 C1,-3 0,2 0,10 C0,18 8,25 18,25 Z" fill="#212121" data-index="8"></path>
      <circle cx="10" cy="-6" r="5" fill="#212121"></circle>
    </g>
  </g>
</svg>